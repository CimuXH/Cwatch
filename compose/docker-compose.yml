name: cwatch

services:
  mysql:
    image: ${CWATCH_IMAGE_PREFIX:-}mysql:8.0
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=48
      - --performance-schema=OFF
      - --mysqlx=OFF
    environment:
      MYSQL_DATABASE: cwatch
      MYSQL_USER: cwatch
      MYSQL_PASSWORD: ${CWATCH_MYSQL_PASSWORD:?Set CWATCH_MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${CWATCH_MYSQL_ROOT_PASSWORD:?Set CWATCH_MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 24

  redis:
    image: ${CWATCH_IMAGE_PREFIX:-}redis:8-alpine
    restart: unless-stopped
    user: redis
    environment:
      REDIS_PASSWORD: ${CWATCH_REDIS_PASSWORD:?Set CWATCH_REDIS_PASSWORD in .env}
    command:
      - sh
      - -ec
      - |
        umask 077
        printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/cwatch-redis.conf
        exec redis-server /tmp/cwatch-redis.conf --save "" --appendonly no --maxmemory 96mb --maxmemory-policy allkeys-lfu
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: ${CWATCH_IMAGE_PREFIX:-}rabbitmq:4.2-alpine
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: cwatch
      RABBITMQ_DEFAULT_PASS: ${CWATCH_RABBITMQ_PASSWORD:?Set CWATCH_RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: cwatch
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2"
      RABBITMQ_CTL_ERL_ARGS: "+S 1:1"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/20-cwatch.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 18

  minio:
    image: cwatch/minio:2025-10-15
    build:
      context: ..
      dockerfile: compose/Dockerfile.minio
      args:
        IMAGE_PREFIX: ${CWATCH_IMAGE_PREFIX:-}
        GOPROXY: ${CWATCH_GOPROXY:-https://proxy.golang.org}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: cwatch-minio-admin
      MINIO_ROOT_PASSWORD: ${CWATCH_MINIO_ROOT_PASSWORD:?Set CWATCH_MINIO_ROOT_PASSWORD in .env}
      MINIO_BROWSER: "off"
      MINIO_REGION_NAME: us-east-1
      HOME: /tmp
      GOMAXPROCS: "2"
      GOMEMLIMIT: 350MiB
    command: ["server", "/data", "--address", ":9000"]
    volumes:
      - minio_data:/data

  minio-init:
    image: cwatch/minio:2025-10-15
    entrypoint: ["/usr/local/bin/cwatch-minio-init"]
    command: []
    environment:
      MINIO_ROOT_USER: cwatch-minio-admin
      MINIO_ROOT_PASSWORD: ${CWATCH_MINIO_ROOT_PASSWORD:?Set CWATCH_MINIO_ROOT_PASSWORD in .env}
      CWATCH_MINIO_ACCESS_KEY: cwatch-app
      CWATCH_MINIO_SECRET_KEY: ${CWATCH_MINIO_APP_PASSWORD:?Set CWATCH_MINIO_APP_PASSWORD in .env}
    depends_on:
      minio:
        condition: service_started

  app:
    image: cwatch/app:local
    build:
      context: ..
      dockerfile: compose/Dockerfile
      args:
        IMAGE_PREFIX: ${CWATCH_IMAGE_PREFIX:-}
        GOPROXY: ${CWATCH_GOPROXY:-https://proxy.golang.org}
        APT_MIRROR: ${CWATCH_APT_MIRROR:-}
    restart: unless-stopped
    stop_signal: SIGINT
    ports:
      - "${CWATCH_HTTP_BIND:-0.0.0.0}:${CWATCH_HTTP_PORT:-8080}:5000"
    environment:
      GIN_MODE: release
      GOMAXPROCS: "2"
      GOMEMLIMIT: 200MiB
      CWATCH_DSN: "cwatch:${CWATCH_MYSQL_PASSWORD:?Set CWATCH_MYSQL_PASSWORD in .env}@tcp(mysql:3306)/cwatch?parseTime=true&charset=utf8mb4&loc=UTC"
      CWATCH_REDIS_URL: "redis://:${CWATCH_REDIS_PASSWORD:?Set CWATCH_REDIS_PASSWORD in .env}@redis:6379/0"
      CWATCH_RABBITMQ_URL: "amqp://cwatch:${CWATCH_RABBITMQ_PASSWORD:?Set CWATCH_RABBITMQ_PASSWORD in .env}@rabbitmq:5672/cwatch"
      CWATCH_MINIO_ENDPOINT: http://minio:9000
      CWATCH_MINIO_ACCESS_KEY: cwatch-app
      CWATCH_MINIO_SECRET_KEY: ${CWATCH_MINIO_APP_PASSWORD:?Set CWATCH_MINIO_APP_PASSWORD in .env}
      CWATCH_MINIO_BUCKET: cwatch
      CWATCH_MINIO_REGION: us-east-1
      CWATCH_MEDIA_DIR: /var/lib/cwatch/media
      CWATCH_WEB_DIR: /opt/cwatch/web
      CWATCH_ADDR: "0.0.0.0:5000"
      CWATCH_WORKERS: "1"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/api/videos"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mysql_data:
  rabbitmq_data:
  minio_data:
